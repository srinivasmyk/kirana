services:
  kirana:
    build: .
    container_name: kirana
    restart: unless-stopped
    ports:
      # Bound to all interfaces so your phone can reach it over Tailscale/LAN.
      # Do NOT port-forward this on your router.
      - "8000:8000"
    env_file: .env
    volumes:
      - ./data:/data
      # Recipes live on the host so you can edit one and just restart —
      # no rebuild needed when a store changes its API.
      - ./app/recipes:/srv/app/recipes
